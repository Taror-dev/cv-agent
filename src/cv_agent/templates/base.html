<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CV-Агент{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cv-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) { /* приватный режим — используем авто-тему */ }
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <div class="container topbar-in">
      <div class="topbar-title">{% block page_title %}{% endblock %}</div>
      <div class="topbar-right">
        <button id="theme-toggle" class="icon-btn" type="button"
                title="Переключить тему" aria-label="Переключить тему">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        {% if current_user %}
        <a href="{{ url_for('profile') }}" class="avatar" title="Профиль">{{ current_user[0]|upper }}</a>
        <form method="post" action="{{ url_for('logout') }}" style="display:inline;margin:0;">
          <button type="submit" class="linklike">Выйти</button>
        </form>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var explicit = document.documentElement.dataset.theme;
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var effective = explicit || (prefersDark ? 'dark' : 'light');
        var next = effective === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('cv-theme', next); } catch (e) { /* noop */ }
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
