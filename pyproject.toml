[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "openai>=1.30",
  "beautifulsoup4>=4.12",
  "flask>=3.0",
  "pypdf>=4.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
cv-agent = "cv_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cv_agent = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=cv_agent",
  "--cov-branch",
  "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["cv_agent"]
branch = true

[tool.coverage.report]
show_missing = true
